<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="GitTrail">
  <!-- 圆角深色底 -->
  <rect width="96" height="96" rx="20" fill="#1e1e1e" />
  <!-- git 分支：主干 + 弧线（品牌蓝） -->
  <path d="M28 20 V46" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" fill="none" />
  <path d="M28 46 C28 60 42 66 56 60" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" fill="none" />
  <!-- 轨迹线：分支弧线末端延伸的青色曲线（Trail） -->
  <path d="M56 60 C68 55 72 42 68 28" stroke="#4ec9b0" stroke-width="6" stroke-linecap="round" fill="none" />
  <!-- 节点 -->
  <circle cx="28" cy="18" r="7" fill="#3b82f6" />
  <circle cx="56" cy="60" r="6" fill="#3b82f6" />
  <circle cx="68" cy="28" r="6" fill="#4ec9b0" />
  <circle cx="28" cy="52" r="5" fill="#569cd6" />
</svg>
